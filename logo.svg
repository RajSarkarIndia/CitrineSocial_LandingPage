<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 200" width="100%" height="100%">
<defs>
  <linearGradient
      id="bluewhite"
      gradientUnits="userSpaceOnUse"
      x1="20"
      y1="50"
      x2="180"
      y2="150">


    
 
    <stop offset="0%" stop-color="#D97706"/>
    <stop offset="35%" stop-color="#FFD54A"/>
    <stop offset="70%" stop-color="#F0A000"/>
    <stop offset="100%" stop-color="#D97706"/>

  </linearGradient>

    <!-- Text -->
  <linearGradient id="textGradient"
      gradientUnits="userSpaceOnUse"
      x1="210" y1="60"
      x2="540" y2="60">

    <stop offset="0%" stop-color="#FFF4C2"/>
    <stop offset="20%" stop-color="#FFD54A"/>
    <stop offset="50%" stop-color="#F0A000"/>
    <stop offset="80%" stop-color="#FFD54A"/>
    <stop offset="100%" stop-color="#FFF4C2"/>

  </linearGradient>
</defs>

  <style>
