    }

    .text-style {
      fill: #D4AF37;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 40px;
      font-weight: 300;
      letter-spacing: 8px;
    }
   
  </style>


  
